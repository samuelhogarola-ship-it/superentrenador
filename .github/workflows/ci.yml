name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate marketplace app
        run: npm run ci

      - name: Install gitleaks
        run: npm run security:setup

      - name: Scan repository secrets
        run: npm run secrets:scan

      - name: Audit production dependencies
        run: npm run audit:deps
