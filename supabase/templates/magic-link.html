<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f5f5f4;color:#1c1917;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <h1 style="font-size:24px;margin:0 0 16px">Accede a Super Entrenador</h1>
      <p style="line-height:1.6;margin:0 0 24px">
        Usa este enlace de un solo uso para iniciar sesión. Caducará en una hora.
      </p>
      <a
        href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email"
        style="display:inline-block;background:#c2410c;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:700"
      >Iniciar sesión</a>
      <p style="font-size:13px;line-height:1.5;color:#78716c;margin:24px 0 0">
        Si no has solicitado este enlace, puedes ignorar el mensaje.
      </p>
    </div>
  </body>
</html>
